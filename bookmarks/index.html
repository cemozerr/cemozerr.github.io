<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Bookmarks — locked</title>
<link rel="icon" href="data:,">
<style>
  :root {
    --bg: #ffffff;
    --fg: #16181c;
    --muted: #5b6570;
    --rule: #e6e8eb;
    --card: #f7f8f9;
    --hover: #fafbfc;
    --accent: #1d6fd0;
    --accent-fg: #ffffff;
    --err: #c0392b;
    --col: 620px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1114;
      --fg: #e7e9ea;
      --muted: #9aa4ae;
      --rule: #24282d;
      --card: #171a1e;
      --hover: #14171b;
      --accent: #6aa9f0;
      --accent-fg: #06121f;
      --err: #f0776a;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 16px;
    line-height: 1.55;
  }
  a { color: var(--accent); }

  /* ---------- gate ---------- */
  #gate { min-height: 100vh; display: grid; place-items: center; padding: 1.5rem; }
  .gate-box { width: 100%; max-width: 22rem; }
  .gate-box h1 { font-size: 1.15rem; margin: 0 0 .35rem; letter-spacing: -.01em; }
  .gate-box p { color: var(--muted); font-size: .86rem; margin: 0 0 1.4rem; }
  label { display: block; font-size: .78rem; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); margin-bottom: .4rem; }
  input[type=password] {
    width: 100%; padding: .7rem .8rem; font-size: 1rem; font-family: inherit;
    color: var(--fg); background: var(--card);
    border: 1px solid var(--rule); border-radius: 9px; outline: none;
  }
  input[type=password]:focus { border-color: var(--accent); }
  button {
    font-family: inherit; font-size: .95rem; font-weight: 600;
    border: none; border-radius: 9px; cursor: pointer;
    padding: .7rem 1rem; background: var(--accent); color: var(--accent-fg);
  }
  button.secondary { background: transparent; color: var(--muted); border: 1px solid var(--rule); font-weight: 500; }
  button:disabled { opacity: .55; cursor: default; }
  #go { width: 100%; margin-top: .8rem; }
  #err { color: var(--err); font-size: .85rem; margin-top: .7rem; min-height: 1.2em; }

  /* ---------- app ---------- */
  #app { display: none; }

  header.bar {
    position: sticky; top: 0; z-index: 20;
    display: flex; align-items: center; gap: .8rem;
    padding: .65rem 1rem;
    background: color-mix(in srgb, var(--bg) 86%, transparent);
    backdrop-filter: blur(12px) saturate(1.2);
    border-bottom: 1px solid var(--rule);
  }
  header.bar .name { font-weight: 700; font-size: .97rem; letter-spacing: -.01em; }
  header.bar .count { color: var(--muted); font-size: .78rem; }
  header.bar .spacer { flex: 1; }
  header.bar button { padding: .35rem .7rem; font-size: .8rem; }

  .chips {
    position: sticky; top: 47px; z-index: 19;
    display: flex; gap: .45rem; overflow-x: auto; scrollbar-width: none;
    padding: .5rem 1rem; border-bottom: 1px solid var(--rule);
    background: color-mix(in srgb, var(--bg) 86%, transparent);
    backdrop-filter: blur(12px) saturate(1.2);
  }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    flex: 0 0 auto; white-space: nowrap; cursor: pointer;
    font-size: .78rem; font-weight: 600; color: var(--muted);
    background: var(--card); border: 1px solid var(--rule);
    border-radius: 999px; padding: .28rem .7rem;
  }
  .chip:hover { color: var(--fg); border-color: var(--accent); }
  .chip .h { color: var(--accent); margin-right: .3rem; font-weight: 700; }

  /* ---------- feed ---------- */
  main { max-width: var(--col); margin: 0 auto; }

  .item { border-bottom: 1px solid var(--rule); transition: background .12s ease; scroll-margin-top: 92px; }
  .item:hover { background: var(--hover); }

  .row {
    display: flex; gap: .65rem; align-items: flex-start;
    padding: 1rem 1.1rem .5rem;
  }
  .row .av {
    width: 38px; height: 38px; border-radius: 50%; flex: 0 0 auto;
    object-fit: cover; background: var(--card);
  }
  .row .ident { min-width: 0; flex: 1; }
  .row .line1 { display: flex; align-items: baseline; gap: .35rem; flex-wrap: wrap; }
  .row .nm { font-weight: 700; font-size: .95rem; letter-spacing: -.01em; }
  .row .hd { color: var(--muted); font-size: .85rem; }
  .row .meta { color: var(--muted); font-size: .78rem; margin-top: .1rem; }
  .row time { color: var(--muted); font-size: .76rem; white-space: nowrap; padding-top: .12rem; }

  .item iframe {
    display: block; width: 100%; border: 0; background: var(--bg);
    overflow: hidden; height: 220px;
    transition: opacity .18s ease;
  }
  .item.pending iframe { opacity: 0; }
  .item.pending::after {
    content: ""; display: block; height: 1px;
  }

  #totop {
    position: fixed; right: 1rem; bottom: 1rem; z-index: 30;
    width: 2.6rem; height: 2.6rem; border-radius: 999px; padding: 0;
    display: none; place-items: center; font-size: 1rem;
    box-shadow: 0 4px 16px rgba(0,0,0,.18);
  }

  .foot { max-width: var(--col); margin: 0 auto; padding: 1.75rem 1.1rem 4rem; color: var(--muted); font-size: .8rem; }
  @media print { .chips, #totop, header.bar { display: none !important; } }
</style>
</head>
<body>

<div id="gate">
  <div class="gate-box">
    <h1>Bookmarks</h1>
    <p>Encrypted with AES-256-GCM. The password never leaves this page.</p>
    <label for="pw">Password</label>
    <input id="pw" type="password" autocomplete="current-password" autofocus>
    <button id="go">Unlock</button>
    <div id="err"></div>
  </div>
</div>

<div id="app">
  <header class="bar">
    <div>
      <div class="name">Bookmarks</div>
      <div class="count" id="count"></div>
    </div>
    <div class="spacer"></div>
    <button class="secondary" id="lock">Lock</button>
  </header>

  <nav class="chips" id="chips" aria-label="Jump to post"></nav>

  <main id="feed"></main>

  <div class="foot">
    Everything on this page — text, images, video — is inside one encrypted vault. Nothing is readable without the password, including from the page source.
  </div>

  <button id="totop" class="secondary" aria-label="Back to top">&uarr;</button>
</div>

<script src="vault.js"></script>
<script>
(function () {
  "use strict";

  var $ = function (id) { return document.getElementById(id); };
  var state = { posts: [], observer: null };

  function b64ToBytes(b64) {
    var bin = atob(b64), out = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }

  async function derive(password, salt, iterations) {
    var km = await crypto.subtle.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveKey"]);
    return crypto.subtle.deriveKey(
      { name: "PBKDF2", salt: salt, iterations: iterations, hash: "SHA-256" },
      km, { name: "AES-GCM", length: 256 }, false, ["decrypt"]
    );
  }

  async function unlock(password) {
    var V = window.VAULT;
    if (!V) throw new Error("vault.js not found");
    var key = await derive(password, b64ToBytes(V.salt), V.it || 600000);
    var plain;
    try {
      plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64ToBytes(V.iv) }, key, b64ToBytes(V.data));
    } catch (e) {
      throw new Error("wrong password");
    }
    return JSON.parse(new TextDecoder().decode(plain));
  }

  function fmtDate(iso) {
    var d = new Date(iso + "T12:00:00Z");
    if (isNaN(d)) return iso;
    return d.toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric", timeZone: "UTC" });
  }

  function fit(frame) {
    try {
      var d = frame.contentDocument;
      if (!d) return;
      var h = Math.max(
        d.documentElement ? d.documentElement.scrollHeight : 0,
        d.body ? d.body.scrollHeight : 0
      );
      var cur = parseFloat(frame.style.height) || 0;
      if (h > 50 && Math.abs(h - cur) > 2) frame.style.height = h + "px";
    } catch (e) { /* ignore */ }
  }

  function mount(card, post) {
    if (card.dataset.mounted) return;
    card.dataset.mounted = "1";
    var frame = card.querySelector("iframe");

    frame.addEventListener("load", function () {
      var settle = function () { fit(frame); };
      settle();
      setTimeout(settle, 80);
      setTimeout(settle, 400);
      setTimeout(settle, 1200);
      card.classList.remove("pending");
      try {
        var d = frame.contentDocument;
        if (!d) return;
        d.querySelectorAll("img, video").forEach(function (el) {
          el.addEventListener("load", settle);
          el.addEventListener("loadedmetadata", settle);
        });
        if (window.ResizeObserver) {
          new ResizeObserver(settle).observe(d.documentElement);
        }
      } catch (e) { /* ignore */ }
    });

    frame.srcdoc = post.embed || post.html;
  }

  function render(payload) {
    state.posts = payload.posts || [];
    var feed = $("feed"), chips = $("chips");
    feed.textContent = ""; chips.textContent = "";
    $("count").textContent = state.posts.length + " saved";

    state.observer = new IntersectionObserver(function (entries) {
      entries.forEach(function (e) {
        if (e.isIntersecting) mount(e.target, state.posts[+e.target.dataset.i]);
      });
    }, { rootMargin: "1400px 0px 1400px 0px" });

    state.posts.forEach(function (p, i) {
      var card = document.createElement("section");
      card.className = "item pending";
      card.dataset.i = i;
      card.id = "p" + i;

      var row = document.createElement("div");
      row.className = "row";

      if (p.avatar) {
        var av = document.createElement("img");
        av.className = "av"; av.src = p.avatar; av.alt = ""; av.loading = "lazy";
        row.appendChild(av);
      }

      var ident = document.createElement("div");
      ident.className = "ident";
      var line1 = document.createElement("div");
      line1.className = "line1";
      var nm = document.createElement("span");
      nm.className = "nm"; nm.textContent = p.name || p.handle;
      var hd = document.createElement("span");
      hd.className = "hd"; hd.textContent = p.handle;
      line1.appendChild(nm); line1.appendChild(hd);
      var meta = document.createElement("div");
      meta.className = "meta";
      meta.textContent = p.blurb || "";
      ident.appendChild(line1); ident.appendChild(meta);
      row.appendChild(ident);

      var t = document.createElement("time");
      t.dateTime = p.date; t.textContent = fmtDate(p.date);
      row.appendChild(t);

      card.appendChild(row);

      var frame = document.createElement("iframe");
      frame.title = p.title;
      frame.setAttribute("scrolling", "no");
      frame.style.height = "220px";
      card.appendChild(frame);
      feed.appendChild(card);
      state.observer.observe(card);

      var chip = document.createElement("button");
      chip.className = "chip";
      chip.type = "button";
      var h = document.createElement("span");
      h.className = "h"; h.textContent = p.handle;
      chip.appendChild(h);
      chip.appendChild(document.createTextNode(p.title && p.title.length > 44 ? p.title.slice(0, 42) + "…" : (p.title || p.blurb || "")));
      chip.addEventListener("click", function () {
        mount(card, p);
        var go = function (smooth) {
          card.scrollIntoView({ behavior: smooth ? "smooth" : "auto", block: "start" });
        };
        go(true);
        setTimeout(function () { go(false); }, 350);
        setTimeout(function () { go(false); }, 1100);
      });
      chips.appendChild(chip);
    });

    $("gate").style.display = "none";
    $("app").style.display = "block";
    document.title = "Bookmarks";
    window.scrollTo(0, 0);
  }

  function lock() {
    state.posts = [];
    if (state.observer) state.observer.disconnect();
    $("feed").textContent = "";
    $("chips").textContent = "";
    $("pw").value = "";
    $("err").textContent = "";
    $("app").style.display = "none";
    $("gate").style.display = "grid";
    document.title = "Bookmarks — locked";
    $("pw").focus();
  }

  var busy = false;
  async function submit() {
    if (busy) return;
    var pw = $("pw").value;
    if (!pw) return;
    busy = true;
    $("go").disabled = true;
    $("go").textContent = "Decrypting…";
    $("err").textContent = "";
    try {
      render(await unlock(pw));
    } catch (e) {
      $("err").textContent = e.message === "wrong password"
        ? "Wrong password."
        : "Could not unlock: " + e.message;
      $("pw").select();
    } finally {
      busy = false;
      $("go").disabled = false;
      $("go").textContent = "Unlock";
    }
  }

  // Preview hook (used by the local layout harness only; inert in production)
  if (window.PLAIN_PAYLOAD) render(window.PLAIN_PAYLOAD);

  window.addEventListener("scroll", function () {
    $("totop").style.display = window.scrollY > 900 ? "grid" : "none";
  }, { passive: true });
  $("totop").addEventListener("click", function () { window.scrollTo({ top: 0, behavior: "smooth" }); });
  $("go").addEventListener("click", submit);
  $("pw").addEventListener("keydown", function (e) { if (e.key === "Enter") submit(); });
  $("lock").addEventListener("click", lock);
})();
</script>
</body>
</html>
